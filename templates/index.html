<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bright Future Coaching AI</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="chat-card shadow-lg">

        <div class="chat-header">
            🎓 Bright Future Coaching AI
        </div>

        <div id="chatbox" class="chat-box">
    <div class="bot-msg welcome-msg">
        Hello! 👋 Welcome to Bright Future Coaching Institute.
    </div>
</div>
 
        <div class="input-group p-3">
            <input type="text" id="userInput" class="form-control" placeholder="Ask about JEE, NEET, UPSC...">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div> 

<script>
function sendMessage() {
    var userText = document.getElementById("userInput").value;
    if(userText.trim() === "") return;

    var chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="user-msg">${userText}</div>
    `;

    chatbox.innerHTML += `
        <div class="bot-msg typing" id="typing">Typing...</div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;

    fetch("/get", {
        method: "POST",
        body: new URLSearchParams({"message": userText}),
        headers: {"Content-Type": "application/x-www-form-urlencoded"}
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("typing").remove();

        chatbox.innerHTML += `
            <div class="bot-msg">${data.response}</div>
        `;

        chatbox.scrollTop = chatbox.scrollHeight;
        document.getElementById("userInput").value = "";
    });
}
</script>

</body>
</html>
